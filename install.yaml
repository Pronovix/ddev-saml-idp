name: saml-idp

project_files:
  - docker-compose.saml-idp.yaml
  - config.saml-idp.yaml
  - saml-idp/Dockerfile
  - saml-idp/entrypoint.sh
  - saml-idp/defaults/config/config.php
  - saml-idp/defaults/config/config-override.php
  - saml-idp/defaults/config/authsources.php
  - saml-idp/defaults/metadata/saml20-idp-hosted.php
  - saml-idp/defaults/metadata/saml20-sp-remote.php
  - saml-idp/defaults/.gitignore
  - saml-idp/.gitignore

ddev_version_constraint: '>= v1.25.2'

post_install_actions:
  - |
    # Add .ddev/saml-idp/certs/ to the project's root .gitignore
    if [ ! -f ../.gitignore ]; then
      touch ../.gitignore
    fi
    if ! grep -q ".ddev/saml-idp/certs/" ../.gitignore; then
      echo -e "\n# ddev-saml-idp-certs\n.ddev/saml-idp/certs/" >> ../.gitignore
    fi

    # Initialize user-owned config templates if they do not already exist.
    # config.php is addon-owned and is NOT copied here; it is managed directly
    # as a project_file so ddev get --update can refresh it safely.
    mkdir -p saml-idp/config
    for f in config-override.php authsources.php; do
      if [ ! -f "saml-idp/config/$f" ]; then
        cp "saml-idp/defaults/config/$f" "saml-idp/config/$f"
        # Strip #ddev-generated so DDEV does not overwrite user edits on update
        sed -i 's|// #ddev-generated||' "saml-idp/config/$f"
      fi
    done

    # Initialize user-owned metadata templates if they do not already exist.
    # saml20-idp-hosted.php is addon-owned and is NOT copied here; it is managed
    # directly as a project_file so ddev get --update can refresh it safely.
    mkdir -p saml-idp/metadata
    for f in saml20-sp-remote.php; do
      if [ ! -f "saml-idp/metadata/$f" ]; then
        cp "saml-idp/defaults/metadata/$f" "saml-idp/metadata/$f"
        # Strip #ddev-generated so DDEV does not overwrite user edits on update
        sed -i 's|// #ddev-generated||' "saml-idp/metadata/$f"
      fi
    done

    # Initialize .env.saml-idp to prevent docker-compose from complaining about a missing file
    if [ ! -f .env.saml-idp ]; then
      echo -e "SAML_SP_PRIMARY_HOST=example.ddev.site\nSAML_IDP_PRIMARY_HOST=idp.example.ddev.site" > .env.saml-idp
    fi

    # Define the SAML IdP configuration overrides block for Drupal's samlauth module
    read -r -d '' OVERRIDES_BLOCK << 'EOF' || true
    // --- BEGIN DDEV SAML IDP OVERRIDES ---
    if (getenv('IS_DDEV_PROJECT')) {
      $idp_host = getenv('SAML_IDP_PRIMARY_HOST') ?: 'idp.example.ddev.site';
      $idp_base_url = 'https://' . $idp_host;

      # Should be the same as $primary_url.
      $config['samlauth.authentication']['sp_entity_id'] = '[site:base-url]';
      $config['samlauth.authentication']['sp_x509_certificate'] = 'file:/mnt/ddev_config/saml-idp/certs/sp.crt';
      $config['samlauth.authentication']['sp_private_key'] = 'file:/mnt/ddev_config/saml-idp/certs/sp.key';

      $config['samlauth.authentication']['idp_entity_id'] = $idp_base_url . '/simplesaml/saml2/idp/metadata';
      $config['samlauth.authentication']['idp_single_sign_on_service'] = $idp_base_url . '/simplesaml/saml2/idp/SSOService.php';
      $config['samlauth.authentication']['idp_single_log_out_service'] = $idp_base_url . '/simplesaml/saml2/idp/SingleLogoutService.php';
      $config['samlauth.authentication']['idp_certs'] = ['file:/mnt/ddev_config/saml-idp/certs/idp.crt'];

      $config['samlauth.authentication']['create_users'] = TRUE;
      $config['samlauth.authentication']['unique_id_attribute'] = 'uid';
      $config['samlauth.authentication']['user_name_attribute'] = 'cn';
      $config['samlauth.authentication']['user_mail_attribute'] = 'email';
    }
    // --- END DDEV SAML IDP OVERRIDES ---
    EOF

    TARGET_DIR="$DDEV_APPROOT/$DDEV_DOCROOT/sites/default"
    if [ -n "$TARGET_DIR" ] && [ -f "$TARGET_DIR/settings.php" ]; then
      # Make directory and settings.php writeable
      chmod 755 "$TARGET_DIR" || true
      chmod 644 "$TARGET_DIR/settings.php" || true

      if grep -E "^\s*[^#/]*(include|require).*project\.local\.settings\.php" "$TARGET_DIR/settings.php" >/dev/null 2>&1; then
        LOCAL_FILE="$TARGET_DIR/project.local.settings.php"
        chmod 644 "$LOCAL_FILE" 2>/dev/null || true
        if [ ! -f "$LOCAL_FILE" ]; then
          echo -e "<?php\n" > "$LOCAL_FILE"
        fi
        if ! grep -q "BEGIN DDEV SAML IDP OVERRIDES" "$LOCAL_FILE"; then
          echo -e "\n$OVERRIDES_BLOCK" >> "$LOCAL_FILE"
        fi
      else
        if ! grep -E "^\s*[^#/]*(include|require).*settings\.local\.php" "$TARGET_DIR/settings.php" >/dev/null 2>&1; then
          read -r -d '' INCLUDE_RULE << 'EOF' || true

    if (file_exists(__DIR__ . '/settings.local.php')) {
      include __DIR__ . '/settings.local.php';
    }
    EOF
          echo -e "$INCLUDE_RULE" >> "$TARGET_DIR/settings.php"
        fi

        LOCAL_FILE="$TARGET_DIR/settings.local.php"
        chmod 644 "$LOCAL_FILE" 2>/dev/null || true
        if [ ! -f "$LOCAL_FILE" ]; then
          echo -e "<?php\n" > "$LOCAL_FILE"
        fi
        if ! grep -q "BEGIN DDEV SAML IDP OVERRIDES" "$LOCAL_FILE"; then
          echo -e "\n$OVERRIDES_BLOCK" >> "$LOCAL_FILE"
        fi
      fi
    fi
