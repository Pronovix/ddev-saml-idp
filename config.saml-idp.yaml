#ddev-generated
hooks:
  pre-start:
    - exec-host: |
        if [ -n "${DDEV_PRIMARY_URL:-}" ]; then
          primary_host=$(echo "$DDEV_PRIMARY_URL" | sed -E 's|https?://||; s|:[0-9]+||')

          # Write/overwrite the saml-idp env file completely (it's owned by this addon)
          printf 'SAML_SP_PRIMARY_HOST=%s\nSAML_IDP_PRIMARY_HOST=idp.%s\n' "$primary_host" "$primary_host" > .ddev/.env.saml-idp

          # Ensure .env.web exists
          touch .ddev/.env.web

          # Update or append SAML_SP_PRIMARY_HOST in .env.web
          if grep -q "^SAML_SP_PRIMARY_HOST=" .ddev/.env.web; then
            # macOS requires an extension argument for sed -i, even if empty
            sed -i .bak "s|^SAML_SP_PRIMARY_HOST=.*|SAML_SP_PRIMARY_HOST=$primary_host|" .ddev/.env.web && rm -f .ddev/.env.web.bak
          else
            echo "SAML_SP_PRIMARY_HOST=$primary_host" >> .ddev/.env.web
          fi

          # Update or append SAML_IDP_PRIMARY_HOST in .env.web
          if grep -q "^SAML_IDP_PRIMARY_HOST=" .ddev/.env.web; then
            # macOS requires an extension argument for sed -i, even if empty
            sed -i .bak "s|^SAML_IDP_PRIMARY_HOST=.*|SAML_IDP_PRIMARY_HOST=idp.$primary_host|" .ddev/.env.web && rm -f .ddev/.env.web.bak
          else
            echo "SAML_IDP_PRIMARY_HOST=idp.$primary_host" >> .ddev/.env.web
          fi
        fi
